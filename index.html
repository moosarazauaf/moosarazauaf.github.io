<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Moosa Raza · Earth Observation Research</title>
  <meta name="description" content="Muhammad Moosa Raza: satellite measurement of floods, drought and land change across Pakistan." />
  <link rel="icon" href="assets/img/profile.jpg" type="image/jpeg" />
  <!-- ?v= is a cache buster: bump it whenever CSS or JS changes so returning
       visitors get the new file instead of a stale cached one. -->
  <link rel="stylesheet" href="assets/css/variables.css?v=36" />
  <link rel="stylesheet" href="assets/css/style.css?v=36" />
  <script>
    // Apply saved theme before paint to avoid a flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem("theme");
      if (!saved) {
        saved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="#top">M. Moosa Raza</a>
      <ul class="nav-links">
        <li><a href="#projects">Projects</a></li>
        <li><a href="#explore">Explore</a></li>
        <li><a href="#publications">Publications</a></li>
        <li><a href="#audit">Verification</a></li>
        <li><a href="#research">Research</a></li>
        <li><a href="#background">Background</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
    </nav>
  </header>

  <main id="top">
    <!-- Cinematic hero: full viewport, map backdrop, type over a scrim -->
    <section id="hero" class="hero"></section>

    <section id="stats" class="band-tint"></section>

    <div class="container">
      <section id="about" class="section"></section>
      <!-- Projects lead: the work is the argument. -->
      <section id="projects" class="section"></section>
      <!-- Both interactives live in one tabbed section. main.js builds the
           panels and drops a tab whose data or library failed to load.
           Panel 1: data/lahore-lulc.json. Panel 2: data/pakistan-districts.geojson. -->
      <section id="explore" class="section"></section>
      <section id="publications" class="section"></section>
      <section id="audit" class="section"></section>
      <section id="research" class="section"></section>
      <!-- Experience, skills, talks and certifications, tabbed. -->
      <section id="background" class="section"></section>
    </div>
  </main>

  <footer id="contact" class="site-footer"></footer>

  <script src="assets/js/main.js?v=36"></script>
</body>
</html>
