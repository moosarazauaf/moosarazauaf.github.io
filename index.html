<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Moosa Raza — Geospatial &amp; Environmental Research</title>
  <meta name="description" content="Portfolio of Muhammad Moosa Raza — remote sensing, carbon dynamics, and Earth observation research." />
  <link rel="icon" href="assets/img/profile.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    // Apply saved theme before paint to avoid a flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem("theme");
      if (!saved) {
        saved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="#top">M. Moosa Raza</a>
      <ul class="nav-links">
        <li><a href="#about">Bio</a></li>
        <li><a href="#publications">Papers</a></li>
        <li><a href="#talks">Talks</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#education">Education</a></li>
      </ul>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
    </nav>
  </header>

  <main id="top">
    <!-- Hero: gradient band with a floating profile card -->
    <div class="hero-band">
      <section id="hero" class="hero-card"></section>
    </div>

    <div class="container">
      <section id="education" class="section"></section>
      <section id="experience" class="section"></section>
      <section id="publications" class="section"></section>
      <section id="projects" class="section"></section>
      <section id="skills" class="section"></section>
      <section id="talks" class="section"></section>
      <section id="certifications" class="section"></section>
    </div>
  </main>

  <footer id="contact" class="site-footer"></footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
